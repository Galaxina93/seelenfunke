services:
    web:
        build: .
        container_name: mein_php_server
        restart: unless-stopped
        ports:
            - "80:80"
            - "6001:6001" # NEU: Macht die WebSockets für deinen Browser erreichbar!
            - "8089:8081" # NEU: Port für den Gemini Live / Twilio WebSocket-Proxy!
        volumes:
            - ./:/var/www/html/
            - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
        # Dieser Befehl ändert das Hauptverzeichnis auf /public, startet den Node-Server im Hintergrund und aktiviert mod_rewrite
        command: >
            bash -c "sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf
            && a2enmod rewrite
            && (cd /var/www/html && nohup node --no-warnings server-twilio.js >/dev/null 2>>/var/www/html/storage/logs/twilio_bridge.log &)
            && apache2-foreground"
    db:
        image: mysql:8.0
        container_name: meine_datenbank
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: seelenfunke  # Hier den Namen deiner DB eintragen
        ports:
            - "3306:3306"
        volumes:
            - seelenfunke_db_data:/var/lib/mysql
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        depends_on:
            - db
    funkenreich:
        image: seelenfunke-web
        container_name: mein_funkenreich_server
        restart: unless-stopped
        ports:
            - "8090:80"
        volumes:
            - ../funkenreich:/var/www/html/
        command: >
            bash -c "sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf
            && a2enmod rewrite
            && ( [ -f /var/www/html/.env ] && chgrp www-data /var/www/html/.env && chmod 640 /var/www/html/.env || true )
            && mkdir -p /var/www/html/storage/database /var/www/html/storage/sessions /var/www/html/storage/nonces /var/www/html/storage/logs
            && chown -R www-data:www-data /var/www/html/storage
            && chmod -R 775 /var/www/html/storage
            && apache2-foreground"

volumes:
    seelenfunke_db_data:
        name: seelenfunke_db_data

